<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">InsightQ architecture diagram</title>
  <desc id="desc">A visual flow of the InsightQ local RAG system showing user, frontend, backend, documents folder, and Ollama services.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="url(#bg)" rx="28"/>
  <rect x="60" y="48" width="1080" height="624" rx="24" fill="#0b1220" stroke="#1f2937" stroke-width="2"/>
  <text x="100" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">InsightQ Local RAG Architecture</text>
  <text x="100" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#94a3b8">Upload PDFs, build a local index, and ask questions with an offline LLM and retrieval pipeline.</text>

  <rect x="120" y="180" width="220" height="120" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">User</text>
  <text x="170" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">Researcher in browser</text>

  <rect x="410" y="180" width="260" height="120" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">React Frontend</text>
  <text x="540" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">Upload, build, chat UI</text>

  <rect x="760" y="180" width="300" height="120" rx="18" fill="#111827" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="910" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">FastAPI Backend</text>
  <text x="910" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">/upload, /build, /chat</text>

  <rect x="180" y="380" width="240" height="140" rx="18" fill="#111827" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="425" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">documents/</text>
  <text x="300" y="455" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">Uploaded PDFs stored locally</text>

  <rect x="480" y="380" width="260" height="140" rx="18" fill="#111827" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="425" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Local RAG Pipeline</text>
  <text x="610" y="455" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">PDF loading, chunking, retrieval</text>

  <rect x="820" y="380" width="260" height="140" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="425" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Ollama Service</text>
  <text x="950" y="455" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">Embeddings + chat model</text>

  <path d="M340 240 L410 240" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M670 240 L760 240" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M860 300 L860 380" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M910 300 L910 380" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M760 300 L610 380" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M760 300 L300 380" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="220" y="570" width="760" height="70" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="600" y="602" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#e2e8f0">Flow: Upload → Build index → Retrieve context → Generate answer</text>
</svg>
